local root=os.getenv("W7_WEATHER_DIR") or (os.getenv("HOME").."/.conky/w7_weather")
local p=dofile(root.."/prefs.lua").load()
local scale=math.max(0.75,math.min(2,(tonumber(p.scale) or 100)/100))
local positions={top_right=true,middle_right=true,bottom_right=true,top_left=true,middle_left=true,bottom_left=true}
local interval=math.max(300,math.min(3600,math.floor(tonumber(p.interval) or 900)))
conky.config={
 update_interval=p.animation=="on" and 0.25 or 1,
 double_buffer=true, background=true,
 own_window=true, own_window_type="dock", own_window_transparent=true,
 own_window_argb_visual=true, own_window_argb_value=0,
 own_window_hints="undecorated,sticky,skip_taskbar,skip_pager,below",
 alignment=positions[p.position] and p.position or "middle_right",
 gap_x=8,gap_y=30,minimum_width=math.floor(220*scale),minimum_height=math.floor(100*scale),
 draw_shades=false,draw_outline=false,draw_borders=false,use_xft=true,
 font="DejaVu Sans:size=10",default_color="FFFFFF",
 lua_load=root.."/draw.lua",lua_draw_hook_pre="conky_draw_w7_weather",
}
conky.text=string.format([[${texeci %d bash "%s/weather.sh"}]],interval,root)
